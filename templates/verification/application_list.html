{% extends 'base.html' %}
{% block title %}Your applications{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Your applications</h1>
  <a class="btn" href="{% url 'verification:apply' %}">Apply for verification</a>
</div>
<form method="get" class="filters">
  <label for="q" class="sr">Search</label>
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="Search by reference, make or serial number">
  <label for="status" class="sr">Status</label>
  <select id="status" name="status">
    <option value="">All statuses</option>
    {% for key, label in statuses %}<option value="{{ key }}"{% if status == key %} selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <button type="submit" class="btn btn-quiet">Filter</button>
</form>
{% include 'includes/application_table.html' with url_name='verification:application_detail' %}
{% include 'includes/pagination.html' %}
{% endblock %}
