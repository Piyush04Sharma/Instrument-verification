{% extends 'base.html' %}
{% block title %}Applications{% endblock %}
{% block content %}
<h1>Applications</h1>
<form method="get" class="filters">
  <label for="q" class="sr">Search</label>
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="Search by reference, serial number or shop">
  <label for="status" class="sr">Status</label>
  <select id="status" name="status">
    <option value="">All statuses</option>
    {% for key, label in statuses %}<option value="{{ key }}"{% if status == key %} selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <button type="submit" class="btn btn-quiet">Filter</button>
</form>
{% include 'includes/application_table.html' with url_name='verification:officer_application_detail' show_applicant=True %}
{% include 'includes/pagination.html' %}
{% endblock %}
