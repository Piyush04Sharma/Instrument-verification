{% if form.non_field_errors %}
  <div class="message error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
